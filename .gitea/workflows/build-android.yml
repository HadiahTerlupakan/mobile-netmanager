name: Build Android AAB

# Build native pindah dari EAS cloud ke runner Gitea sendiri karena kuota build
# akun gratis. Yang ikut pindah bukan hanya perintahnya: dua tanggung jawab yang
# dulu dipegang EAS sekarang milik workflow ini.
#
# 1. Menandatangani artefak. `plugins/withReleaseSigningConfig.js` menulis
#    `signingConfig hasReleaseConfig ? release : debug` — build tanpa kredensial
#    tetap menghasilkan AAB, hanya bertanda tangan kunci debug. Artefak itu
#    terlihat normal sampai Play Store menolaknya.
# 2. Memberi versionCode. `appVersionSource: "remote"` berarti EAS yang dulu
#    memegang angkanya; tanpa pengganti, `expo prebuild` menulis versionCode 1.
#    Angkanya kini dihitung dari bundle tertinggi di Play Store.
#
# Keduanya baru terlihat saat unggah ke Play Store, setelah satu build panjang
# terbuang. Karena itu keduanya diperiksa di sini, sedini mungkin.
#
# Catatan sumber daya: runner ini 4 core / 11 GB dan `capacity: 1`, dipakai juga
# oleh deploy produksi netmanager. Proyek ini memakai New Architecture, jadi
# build mengompilasi C++ untuk empat ABI. Build di sini jauh lebih lama daripada
# ~21 menit di EAS cloud — itu harga yang ditukar dengan kuota.

on:
  # Otomatis hanya ketika sesuatu yang tidak bisa dikirim lewat OTA berubah.
  # Daftar ini sama dengan NATIVE_PATHS di scripts/native-state.js (dijaga tes),
  # ditambah berkas pipeline ini sendiri supaya perubahan pipeline langsung
  # diuji oleh build sungguhan. native-build.json — catatan yang di-commit balik
  # oleh workflow ini — sengaja tidak ada di sini supaya tidak memicu dirinya.
  push:
    branches: [main]
    paths:
      - "app.json"
      - "app.config.ts"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "plugins/**"
      - "firebase.json"
      - "assets/images/**"
      - "assets/sounds/**"
      - "assets/expo-updates/**"
      - ".gitea/workflows/build-android.yml"
      - "scripts/play-internal.js"
      - "scripts/native-state.js"
  workflow_dispatch:
    inputs:
      version_code_override:
        description: >-
          versionCode yang dipakai. Kosongkan untuk memakai versionCode
          tertinggi di Play Store + 1.
        type: string
        required: false

# Dua build native bersamaan akan berebut 11 GB RAM dan menjatuhkan keduanya.
concurrency:
  group: build-android
  cancel-in-progress: false

env:
  REPO_CLONE_URL: http://gitea:3000/${{ github.repository }}.git
  AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
  KEYSTORE_NAMA: release.jks

jobs:
  build:
    name: Build & sign AAB
    runs-on: android-ci
    steps:
      # Kredensial diperiksa sebelum apa pun dipasang atau dibangun. Tanpa ini
      # secret yang hilang baru terasa di akhir — dan Gradle tidak berhenti, ia
      # jatuh ke debug keystore.
      #
      # Nilai secret tidak pernah dicetak; yang dilaporkan hanya ada/tidak ada.
      - name: Periksa kredensial signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RADPRO_RELEASE_KEYSTORE_BASE64 }}
          RADPRO_RELEASE_STORE_PASSWORD: ${{ secrets.RADPRO_RELEASE_STORE_PASSWORD }}
          RADPRO_RELEASE_KEY_ALIAS: ${{ secrets.RADPRO_RELEASE_KEY_ALIAS }}
          RADPRO_RELEASE_KEY_PASSWORD: ${{ secrets.RADPRO_RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail

          gagal() { echo "::error::$1"; exit 1; }

          # Service account Play dipakai dua kali: sebelum build untuk menghitung
          # versionCode, dan sesudahnya untuk mengunggah. Diperiksa di sini
          # supaya secret yang hilang tidak baru ketahuan setelah build sejam.
          [ -n "${PLAY_SA_BASE64}" ] || gagal "Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 kosong"
          printf '%s' "${PLAY_SA_BASE64}" | base64 -d \
            | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!s.client_email||!s.private_key) process.exit(1)' 2>/dev/null \
            || gagal "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 bukan service account yang sah"

          # google-services.json di-.gitignore. Dulu EAS menyuntikkannya lewat
          # variabel berkas GOOGLE_SERVICES_JSON; tanpa itu `expo prebuild`
          # gagal menyalinnya (run #13 berhenti persis di sana).
          [ -n "${GOOGLE_SERVICES_BASE64}" ] || gagal "Secret GOOGLE_SERVICES_JSON_BASE64 kosong"
          printf '%s' "${GOOGLE_SERVICES_BASE64}" | base64 -d | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8"))' 2>/dev/null \
            || gagal "GOOGLE_SERVICES_JSON_BASE64 bukan base64 dari JSON yang sah"

          [ -n "${KEYSTORE_BASE64}" ] || gagal "Secret RADPRO_RELEASE_KEYSTORE_BASE64 kosong"
          [ -n "${RADPRO_RELEASE_STORE_PASSWORD}" ] || gagal "Secret RADPRO_RELEASE_STORE_PASSWORD kosong"
          [ -n "${RADPRO_RELEASE_KEY_ALIAS}" ] || gagal "Secret RADPRO_RELEASE_KEY_ALIAS kosong"
          [ -n "${RADPRO_RELEASE_KEY_PASSWORD}" ] || gagal "Secret RADPRO_RELEASE_KEY_PASSWORD kosong"

          # Base64 yang rusak baru ketahuan saat decode; lebih murah sekarang.
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > /tmp/uji-keystore 2>/dev/null \
            || gagal "RADPRO_RELEASE_KEYSTORE_BASE64 bukan base64 yang sah"
          [ -s /tmp/uji-keystore ] || gagal "Keystore hasil decode kosong"
          rm -f /tmp/uji-keystore

          echo "Kredensial signing lengkap."

      - name: Ambil kode dari Gitea
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${REPO_CLONE_URL}"
          git config --local http.extraheader \
            "Authorization: basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git config --local --unset-all http.extraheader

      - name: Pasang dependensi
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for percobaan in 1 2 3; do
            if npm ci --no-audit --prefer-offline; then break; fi
            if [ "$percobaan" = 3 ]; then echo "npm ci gagal setelah 3 percobaan" >&2; exit 1; fi
            echo "npm ci gagal (percobaan $percobaan), mengulang dalam 15 detik" >&2
            sleep 15
          done

      # Gerbang mutu dijalankan sebelum build panjangnya, bukan sesudah: satu
      # kesalahan tipe tidak pantas menghabiskan satu jam waktu runner.
      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tes unit
        run: npx jest --ci

      # Play sendiri yang menegakkan aturan "lebih besar dari setiap bundle yang
      # pernah diunggah", jadi angkanya dihitung dari daftar bundle di sana.
      # Nomor run Gitea tidak bisa dipakai: dihitung per repo, bukan per
      # workflow, sehingga melompat setiap kali CI atau OTA berjalan.
      - name: Tentukan versionCode
        env:
          OVERRIDE: ${{ inputs.version_code_override }}
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          export GOOGLE_PLAY_SERVICE_ACCOUNT_JSON="$(printf '%s' "${PLAY_SA_BASE64}" | base64 -d)"
          VERSION_CODE="$(node scripts/play-internal.js next-version-code "${OVERRIDE:-}")"
          echo "versionCode: ${VERSION_CODE}"
          echo "RADPRO_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Pasang google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${GOOGLE_SERVICES_BASE64}" | base64 -d > google-services.json
          echo "google-services.json terpasang ($(stat -c %s google-services.json) byte)."

      - name: Generate proyek Android
        env:
          EXPO_PUBLIC_APP_VARIANT: production
          EXPO_DEBUG: "false"
          EXPO_NO_DOTENV: "1"
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          chmod +x android/gradlew

          # Memori Gradle disetel di sini, bukan di app.json. Run #16 gagal di
          # menit ke-107 karena R8 kehabisan heap 2 GiB: app.json meminta 4 GB
          # lewat expo-build-properties.gradleProperties, tetapi plugin itu
          # tidak mengenal opsi tersebut dan mengabaikannya diam-diam. EAS tidak
          # pernah terkena karena mesin build-nya menyetel memori sendiri.
          #
          # Anggaran container 9 GB: heap 5 GB + metaspace 1 GB untuk daemon
          # Gradle (R8 berjalan di dalamnya), sisanya untuk kompilasi C++ dua
          # worker. Kotlin dikompilasi di dalam proses Gradle supaya tidak ada
          # JVM kedua yang meminta heap sendiri di luar anggaran itu.
          sed -i '/^org\.gradle\.jvmargs=/d; /^kotlin\.daemon\.jvmargs=/d; /^kotlin\.compiler\.execution\.strategy=/d' android/gradle.properties
          # Diawali baris baru: gradle.properties hasil prebuild tidak diakhiri
          # newline, dan tanpa ini pengaturan heap menempel ke baris terakhir
          # (android.extraMavenRepos) — heap tidak terbaca dan repositori
          # JitPack ikut rusak.
          printf '\n%s\n%s\n' \
            'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' \
            'kotlin.compiler.execution.strategy=in-process' \
            >> android/gradle.properties

          # Dibuktikan, bukan diasumsikan: tepat satu baris jvmargs yang benar,
          # dan baris extraMavenRepos masih utuh.
          [ "$(grep -c '^org\.gradle\.jvmargs=-Xmx5g ' android/gradle.properties)" = 1 ] || {
            echo "::error::org.gradle.jvmargs tidak tertulis sebagai satu baris utuh di gradle.properties" >&2
            cat android/gradle.properties >&2
            exit 1
          }
          grep -qE '^android\.extraMavenRepos=\[.*\]$' android/gradle.properties || {
            echo "::error::Baris android.extraMavenRepos rusak setelah gradle.properties diubah" >&2
            exit 1
          }
          grep -E '^(org\.gradle\.jvmargs|kotlin\.compiler|android\.extraMavenRepos)' android/gradle.properties

      # Keystore ditulis setelah prebuild: `--clean` menghapus seluruh isi
      # android/, termasuk berkas apa pun yang ditaruh di sana sebelumnya.
      - name: Pasang keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RADPRO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "android/app/${KEYSTORE_NAMA}"
          chmod 600 "android/app/${KEYSTORE_NAMA}"
          echo "Keystore terpasang ($(stat -c %s "android/app/${KEYSTORE_NAMA}") byte)."

      - name: Verifikasi kunci dan versionCode sebelum build
        env:
          RADPRO_RELEASE_STORE_PASSWORD: ${{ secrets.RADPRO_RELEASE_STORE_PASSWORD }}
          RADPRO_RELEASE_KEY_ALIAS: ${{ secrets.RADPRO_RELEASE_KEY_ALIAS }}
          SIDIK_DIHARAPKAN: ${{ vars.RADPRO_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail

          # Sidik jari kunci. Play Store hanya menerima unggahan yang
          # ditandatangani kunci upload yang terdaftar; kunci yang salah
          # ditolak setelah build selesai dan terunggah.
          SIDIK="$(keytool -list -v \
            -keystore "android/app/${KEYSTORE_NAMA}" \
            -alias "${RADPRO_RELEASE_KEY_ALIAS}" \
            -storepass "${RADPRO_RELEASE_STORE_PASSWORD}" 2>/dev/null \
            | awk 'tolower($0) ~ /sha256:/ && !ketemu { sub(/.*SHA256: */, ""); gsub(/ /, ""); print; ketemu=1 }')"

          [ -n "${SIDIK}" ] || {
            echo "::error::Tidak bisa membaca sidik jari kunci — alias atau password keystore salah." >&2
            exit 1
          }
          echo "Sidik jari kunci (SHA-256): ${SIDIK}"

          if [ -z "${SIDIK_DIHARAPKAN:-}" ]; then
            echo "::warning::Variabel RADPRO_UPLOAD_CERT_SHA256 belum diset. Bandingkan sidik jari di atas dengan sertifikat kunci upload di Play Console, lalu simpan sebagai variabel repo supaya pergantian kunci tertangkap otomatis."
          elif [ "${SIDIK}" != "${SIDIK_DIHARAPKAN}" ]; then
            echo "::error::Sidik jari kunci tidak cocok dengan RADPRO_UPLOAD_CERT_SHA256. Play Store akan menolak artefak ini." >&2
            exit 1
          else
            echo "Sidik jari kunci cocok dengan yang terdaftar."
          fi

          # versionCode yang benar-benar tertulis ke proyek hasil prebuild.
          # Memeriksa niat (env) tidak cukup — yang menentukan isi artefak
          # adalah angka di build.gradle.
          TERTULIS="$(awk 'match($0, /versionCode +[0-9]+/) && !ketemu { s=substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", s); print s; ketemu=1 }' android/app/build.gradle)"
          echo "versionCode di build.gradle: ${TERTULIS} (diharapkan ${RADPRO_VERSION_CODE})"

          [ "${TERTULIS}" = "${RADPRO_VERSION_CODE}" ] || {
            echo "::error::versionCode di build.gradle (${TERTULIS}) tidak sama dengan yang diminta (${RADPRO_VERSION_CODE}). app.config.ts tidak menerima RADPRO_VERSION_CODE." >&2
            exit 1
          }

      - name: Build AAB
        env:
          EXPO_PUBLIC_APP_VARIANT: production
          EXPO_DEBUG: "false"
          EXPO_NO_DOTENV: "1"
          RADPRO_RELEASE_STORE_FILE: ${{ env.KEYSTORE_NAMA }}
          RADPRO_RELEASE_STORE_PASSWORD: ${{ secrets.RADPRO_RELEASE_STORE_PASSWORD }}
          RADPRO_RELEASE_KEY_ALIAS: ${{ secrets.RADPRO_RELEASE_KEY_ALIAS }}
          RADPRO_RELEASE_KEY_PASSWORD: ${{ secrets.RADPRO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          # --no-daemon: daemon yang menetap menahan 4 GB heap di runner yang
          # juga melayani deploy produksi.
          #
          # --max-workers=2: tiap worker menjalankan kompilasi C++ New
          # Architecture sendiri-sendiri. Empat worker paralel di atas heap
          # Gradle 4 GB menembus batas 9 GB container dan dibunuh OOM — gagal
          # yang tampil sebagai "exit 137" tanpa satu pun pesan kompilasi.
          ./gradlew :app:bundleRelease -x lint -x lintVitalRelease --no-daemon --max-workers=2

      # Langkah inilah yang menutup jebakan debug-signing. Build di atas tetap
      # "berhasil" tanpa kredensial yang benar; yang membedakan hanya siapa
      # penandatangannya.
      - name: Verifikasi tanda tangan artefak
        run: |
          set -euo pipefail

          [ -f "${AAB_PATH}" ] || {
            echo "::error::AAB tidak ditemukan di ${AAB_PATH}" >&2
            exit 1
          }

          SERTIFIKAT="$(jarsigner -verify -verbose:summary -certs "${AAB_PATH}" 2>&1)"
          awk 'tolower($0) ~ /jar verified|signed by/' <<< "${SERTIFIKAT}"

          # Pencocokan teks memakai here-string, bukan pipa. Keluaran jarsigner
          # untuk AAB sangat panjang: di bawah pipefail, `grep -q` yang berhenti
          # di kecocokan pertama membuat printf kena SIGPIPE dan seluruh pipa
          # dianggap gagal. Run #17 menolak AAB yang bertanda tangan benar
          # karena itu — dan di dalam `if`, cacat yang sama bisa meloloskan
          # artefak bertanda tangan debug.
          grep -q 'jar verified' <<< "${SERTIFIKAT}" || {
            echo "::error::AAB tidak lolos verifikasi tanda tangan." >&2
            exit 1
          }

          # Debug keystore Android selalu memakai alias androiddebugkey dengan
          # subjek CN=Android Debug. Kalau salah satunya muncul, Gradle jatuh ke
          # cabang debug dan artefak ini tidak layak diunggah.
          if grep -qiE 'androiddebugkey|CN=Android Debug' <<< "${SERTIFIKAT}"; then
            echo "::error::AAB ditandatangani debug keystore, bukan kunci rilis. Play Store akan menolaknya." >&2
            exit 1
          fi

          echo "Artefak ditandatangani kunci rilis."
          echo "Ukuran: $(stat -c %s "${AAB_PATH}") byte"
          echo "SHA-256 artefak: $(sha256sum "${AAB_PATH}" | cut -d' ' -f1)"

      # Isi bundle JS diperiksa dari artefak, bukan dari env: yang dijalankan
      # perangkat adalah bundle di dalam AAB. Firebase JS SDK butuh konfigurasi
      # web — key Android ditolak Google untuk panggilan JS (403), dan bundle
      # yang membawanya tetap lolos build lalu mematikan chat serta realtime
      # work order. OTA 8f311761 terbit dengan cacat persis itu.
      - name: Periksa konfigurasi Firebase di bundle
        run: |
          set -euo pipefail
          unzip -p "${AAB_PATH}" base/assets/index.android.bundle > /tmp/bundle-aab

          grep -qaE '1:[0-9]+:web:[0-9a-f]+' /tmp/bundle-aab || {
            echo "::error::Bundle di AAB tidak memuat app id Firebase web. Chat dan realtime akan ditolak Google (403)." >&2
            exit 1
          }
          if grep -qaE '1:[0-9]+:android:[0-9a-f]+' /tmp/bundle-aab; then
            echo "::error::Bundle di AAB memuat app id Firebase Android — ditolak untuk panggilan dari JS SDK." >&2
            exit 1
          fi
          rm -f /tmp/bundle-aab
          echo "Konfigurasi Firebase di bundle: web."

      # runtimeVersion dibaca dari artefak — base/assets/fingerprint, ditulis
      # expo-updates saat build Gradle. Fingerprint yang dihitung ulang secara
      # lokal bisa berbeda dari angka itu, dan perangkat hanya menerima OTA yang
      # runtime-nya sama persis dengan yang tertanam.
      - name: Baca runtimeVersion dari AAB
        run: |
          set -euo pipefail
          RUNTIME="$(unzip -p "${AAB_PATH}" base/assets/fingerprint | tr -d '[:space:]')"
          [ "${#RUNTIME}" -ge 16 ] || {
            echo "::error::base/assets/fingerprint di AAB kosong atau tidak sah: '${RUNTIME}'" >&2
            exit 1
          }
          echo "RADPRO_FINGERPRINT=${RUNTIME}" >> "$GITHUB_ENV"
          echo "runtimeVersion tertanam di AAB: ${RUNTIME}"

      # Track internal saja. Promosi ke produksi sengaja manual lewat Play
      # Console, setelah build diuji di perangkat.
      - name: Unggah ke Play Store (track internal)
        env:
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          export GOOGLE_PLAY_SERVICE_ACCOUNT_JSON="$(printf '%s' "${PLAY_SA_BASE64}" | base64 -d)"
          VERSION_NAME="$(node -p 'require("./app.json").expo.version')"
          node scripts/play-internal.js upload "${AAB_PATH}" "${RADPRO_VERSION_CODE}" "${VERSION_NAME} (${RADPRO_VERSION_CODE})"
          echo "::notice::versionCode ${RADPRO_VERSION_CODE} terbit di track internal. Uji di perangkat, lalu promosikan ke produksi lewat Play Console."

      # Catatan ini yang dibaca workflow OTA: runtime tujuan, dan kapan harus
      # menahan diri karena bagian native berubah. Ditulis hanya setelah
      # unggahan berhasil — catatan yang mendahuluinya akan mengarahkan OTA ke
      # APK yang tidak pernah terbit.
      #
      # Hash native dihitung di commit yang dibangun, lalu berkasnya diletakkan
      # di atas main terbaru: main bisa sudah maju selama build berjalan.
      # Commit ini tidak memakai [skip ci] supaya OTA menyusul menerbitkan JS
      # HEAD ke runtime baru.
      - name: Catat build native ke main
        run: |
          set -euo pipefail
          node scripts/native-state.js record "${RADPRO_FINGERPRINT}" "${RADPRO_VERSION_CODE}"
          cp native-build.json /tmp/native-build.json

          git config --local user.name "gitea-actions"
          git config --local user.email "actions@gitea.local"
          git config --local http.extraheader \
            "Authorization: basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)"

          for percobaan in 1 2 3; do
            git fetch -q --depth=1 origin main
            git checkout -q -B catat-build FETCH_HEAD
            cp /tmp/native-build.json native-build.json
            git add native-build.json
            git commit -q -m "chore(build): catat build native versionCode ${RADPRO_VERSION_CODE}" \
              -m "runtimeVersion ${RADPRO_FINGERPRINT}, dibangun dari ${GITHUB_SHA}."
            if git push -q origin HEAD:refs/heads/main; then
              echo "native-build.json tercatat di main."
              break
            fi
            if [ "$percobaan" = 3 ]; then
              echo "::error::Gagal mencatat native-build.json ke main. AAB sudah di track internal, tetapi OTA belum tahu runtime barunya." >&2
              exit 1
            fi
            echo "main bergerak, mengulang pencatatan (percobaan $percobaan)" >&2
            sleep 5
          done
          git config --local --unset-all http.extraheader

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.RADPRO_VERSION_CODE }}-aab
          path: |
            ${{ env.AAB_PATH }}
            native-build.json
          retention-days: 30
          if-no-files-found: error

      # Runner ini menetap antar-run dan melayani repo lain. Keystore yang
      # tertinggal akan terbawa ke job berikutnya.
      - name: Hapus keystore
        if: always()
        run: rm -f "android/app/${KEYSTORE_NAMA}" /tmp/uji-keystore /tmp/bundle-aab google-services.json
