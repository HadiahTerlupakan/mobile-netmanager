# ===========================================
# LOGIN FLOW
# Tests employee login from fresh state  
# Uses percentage-based coordinates for RN compatibility
# ===========================================

appId: com.netmanager.mobile

---
- launchApp:
    clearState: true

- waitForAnimationToEnd

# Handle Expo dev menu if present
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: "http://10.0.2.2:8081"
      - waitForAnimationToEnd

# Handle Expo onboarding dialog
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

# Handle Expo dev menu settings
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Go home"
      - waitForAnimationToEnd

# Wait for login screen to appear
- extendedWaitUntil:
    visible: "SBL KARYAWAN"
    timeout: 30000

# Wait for full page render
- waitForAnimationToEnd

# Tap on email input field (below logo and labels, roughly at 42%)
- tapOn:
    point: "50%,42%"
- inputText: "qa.fieldtech@test.com"
- hideKeyboard

# Small delay between fields
- waitForAnimationToEnd

# Tap on password input field (below email field, roughly at 55%)
- tapOn:
    point: "50%,55%"
- inputText: "qatest123"
- hideKeyboard

# Tap Sign In button (bottom area of form, roughly at 68%)
- tapOn:
    point: "50%,68%"

# Wait for login to complete
- extendedWaitUntil:
    visible: "Beranda"
    timeout: 30000

# Final verification
- assertVisible: "Beranda"
