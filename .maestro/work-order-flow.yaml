# ===========================================
# WORK ORDER FLOW
# Tests WO navigation
# ===========================================

appId: com.netmanager.mobile

---
- launchApp

- waitForAnimationToEnd

# Login if on login screen
- runFlow:
    when:
      visible: "SBL KARYAWAN"
    commands:
      - tapOn:
          point: "50%,42%"
      - inputText: "qa.fieldtech@test.com"
      - hideKeyboard
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,55%"
      - inputText: "qatest123"
      - hideKeyboard
      - tapOn:
          point: "50%,68%"
      - extendedWaitUntil:
          visible: "Beranda"
          timeout: 20000

# Ensure on dashboard
- extendedWaitUntil:
    visible: "Beranda"
    timeout: 15000

# Navigate to Work Orders
- tapOn: "Work Order"

# Wait for WO screen
- extendedWaitUntil:
    visible: "Tersedia"
    timeout: 10000

# View tabs
- tapOn: "Tersedia"
- waitForAnimationToEnd

- tapOn: "Aktif"
- waitForAnimationToEnd

- tapOn: "Riwayat"
- waitForAnimationToEnd

- tapOn: "Tersedia"
