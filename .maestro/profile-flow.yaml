# ===========================================
# PROFILE FLOW
# Tests profile screen and logout
# ===========================================

appId: com.netmanager.mobile

---
- launchApp

- waitForAnimationToEnd

# Login if on login screen
- runFlow:
    when:
      visible: "SBL KARYAWAN"
    commands:
      - tapOn:
          point: "50%,42%"
      - inputText: "qa.fieldtech@test.com"
      - hideKeyboard
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,55%"
      - inputText: "qatest123"
      - hideKeyboard
      - tapOn:
          point: "50%,68%"
      - extendedWaitUntil:
          visible: "Beranda"
          timeout: 20000

# Ensure on dashboard
- extendedWaitUntil:
    visible: "Beranda"
    timeout: 15000

# Navigate to Profile
- tapOn: "Profil"

- waitForAnimationToEnd

# Scroll to logout and tap
- scrollUntilVisible:
    element: "Keluar"
    direction: DOWN
    timeout: 10000

- tapOn: "Keluar"

# Verify logout
- extendedWaitUntil:
    visible: "SBL KARYAWAN"
    timeout: 10000
