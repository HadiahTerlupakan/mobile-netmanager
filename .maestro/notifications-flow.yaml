# ===========================================
# NOTIFICATIONS FLOW  
# Tests notification screen
# ===========================================

appId: com.netmanager.mobile

---
- launchApp

- waitForAnimationToEnd

# Login if on login screen
- runFlow:
    when:
      visible: "SBL KARYAWAN"
    commands:
      - tapOn:
          point: "50%,42%"
      - inputText: "qa.fieldtech@test.com"
      - hideKeyboard
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,55%"
      - inputText: "qatest123"
      - hideKeyboard
      - tapOn:
          point: "50%,68%"
      - extendedWaitUntil:
          visible: "Beranda"
          timeout: 20000

# Ensure on dashboard
- extendedWaitUntil:
    visible: "Beranda"
    timeout: 15000

# Navigate to Notifications if visible
- runFlow:
    when:
      visible: "Notifikasi"
    commands:
      - tapOn: "Notifikasi"
      - waitForAnimationToEnd
      - tapOn: "Beranda"
      - waitForAnimationToEnd
