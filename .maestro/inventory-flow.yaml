# ===========================================
# INVENTORY FLOW
# Tests inventory/barang navigation
# ===========================================

appId: com.netmanager.mobile

---
- launchApp

- waitForAnimationToEnd

# Login if on login screen
- runFlow:
    when:
      visible: "SBL KARYAWAN"
    commands:
      - tapOn:
          point: "50%,42%"
      - inputText: "qa.fieldtech@test.com"
      - hideKeyboard
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,55%"
      - inputText: "qatest123"
      - hideKeyboard
      - tapOn:
          point: "50%,68%"
      - extendedWaitUntil:
          visible: "Beranda"
          timeout: 20000

# Ensure on dashboard
- extendedWaitUntil:
    visible: "Beranda"
    timeout: 15000

# Navigate to Barang if visible
- runFlow:
    when:
      visible: "Barang"
    commands:
      - tapOn: "Barang"
      - waitForAnimationToEnd
      - tapOn: "Beranda"
      - waitForAnimationToEnd

# Navigate to Ambil Barang if visible
- runFlow:
    when:
      visible: "Ambil Barang"
    commands:
      - tapOn: "Ambil Barang"
      - waitForAnimationToEnd
      - tapOn: "Beranda"
      - waitForAnimationToEnd
