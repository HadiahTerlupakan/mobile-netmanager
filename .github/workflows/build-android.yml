name: Build Android AAB

# Build native tidak lagi memakai EAS cloud karena kuota build akun gratis.
# Yang ikut pindah bukan hanya perintahnya: dua tanggung jawab yang dulu
# dipegang EAS sekarang milik workflow ini.
#
# 1. Menandatangani artefak. `plugins/withReleaseSigningConfig.js` menulis
#    `signingConfig hasReleaseConfig ? release : debug` — build tanpa kredensial
#    tetap menghasilkan AAB, hanya bertanda tangan kunci debug. Artefak itu
#    terlihat normal sampai Play Store menolaknya.
# 2. Memberi versionCode. `appVersionSource: "remote"` berarti EAS yang dulu
#    memegang angkanya; tanpa pengganti, `expo prebuild` menulis versionCode 1.
#    Angkanya kini dihitung dari bundle tertinggi di Play Store.
#
# Keduanya baru terlihat saat unggah ke Play Store, setelah satu build panjang
# terbuang. Karena itu keduanya diperiksa di sini, sedini mungkin.
#
# Catatan sumber daya: runner GitHub-hosted `ubuntu-24.04` untuk repo private
# hanya 2 vCPU / 7 GB. Proyek ini memakai New Architecture, jadi build
# mengompilasi C++ untuk empat ABI. Build di sini jauh lebih lama daripada
# ~21 menit di EAS cloud — itu harga yang ditukar dengan kuota.
#
# Workflow ini memakai secret signing dan publish, jadi tidak pernah dipicu
# `pull_request` atau `pull_request_target`, dan job-nya memakai environment
# `production` (hanya boleh dari branch main).

on:
  # Otomatis HANYA ketika sesuatu yang tidak bisa dikirim lewat OTA berubah.
  # Daftar ini persis NATIVE_PATHS di scripts/native-state.js (dijaga tes).
  #
  # Berkas pipeline (workflow ini, native-state.js, play-internal.js) sengaja
  # tidak memicu build. runtimeVersion adalah fingerprint yang berbeda antar
  # mesin build untuk kode native yang sama (a96b2225 di runner GitHub vs
  # 6fb4906a di HP pengguna, run 36099338043). Build yang dipicu perubahan
  # pipeline akan mencatat runtime baru dan memutus OTA ke semua HP tanpa APK
  # baru yang disebar. Uji perubahan pipeline lewat workflow_dispatch dengan
  # mode_uji. native-build.json — catatan yang di-commit balik — juga tidak ada
  # di sini supaya tidak memicu dirinya.
  push:
    branches: [main]
    paths:
      - "app.json"
      - "app.config.ts"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "plugins/**"
      - "firebase.json"
      - "assets/images/**"
      - "assets/sounds/**"
      - "assets/expo-updates/**"
  workflow_dispatch:
    inputs:
      version_code_override:
        description: >-
          versionCode yang dipakai. Kosongkan untuk memakai versionCode
          tertinggi di Play Store + 1.
        type: string
        required: false
      mode_uji:
        description: >-
          Build, tanda tangani, dan verifikasi AAB SAJA — tanpa unggah ke Play
          Store, tanpa mencatat native-build.json, tanpa susulan OTA. Dipakai
          untuk membuktikan pipeline dan membandingkan runtimeVersion hasil
          build dengan build terakhir tanpa efek samping apa pun.
        type: boolean
        default: false

# Izin bawaan hanya baca. Satu-satunya job di bawah menaikkannya ke
# `contents: write` karena ia meng-commit balik native-build.json ke main.
permissions:
  contents: read

# Dua build native bersamaan akan mencatat native-build.json saling tindih, dan
# versionCode keduanya dihitung dari Play Store pada saat yang sama.
concurrency:
  group: build-android
  cancel-in-progress: false

env:
  AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
  KEYSTORE_NAMA: release.jks

jobs:
  build:
    name: Build & sign AAB
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    env:
      # Versi dipatok persis, sama dengan image runner `android-ci` lama dan
      # dengan `expo-build-properties` di app.json. Android SDK yang bergerak
      # sendiri akan mengubah hasil build tanpa satu baris kode pun berubah.
      JAVA_VERSION: "17"
      ANDROID_PLATFORM: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK_VERSION: "27.1.12297006"
      ANDROID_CMAKE_VERSION: "3.22.1"
    steps:
      # Kredensial diperiksa sebelum apa pun dipasang atau dibangun. Tanpa ini
      # secret yang hilang baru terasa di akhir — dan Gradle tidak berhenti, ia
      # jatuh ke debug keystore.
      #
      # Nilai secret tidak pernah dicetak; yang dilaporkan hanya ada/tidak ada.
      - name: Periksa kredensial signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RADPRO_RELEASE_KEYSTORE_BASE64 }}
          RADPRO_RELEASE_STORE_PASSWORD: ${{ secrets.RADPRO_RELEASE_STORE_PASSWORD }}
          RADPRO_RELEASE_KEY_ALIAS: ${{ secrets.RADPRO_RELEASE_KEY_ALIAS }}
          RADPRO_RELEASE_KEY_PASSWORD: ${{ secrets.RADPRO_RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail

          gagal() { echo "::error::$1"; exit 1; }

          # Service account Play dipakai dua kali: sebelum build untuk menghitung
          # versionCode, dan sesudahnya untuk mengunggah. Diperiksa di sini
          # supaya secret yang hilang tidak baru ketahuan setelah build sejam.
          [ -n "${PLAY_SA_BASE64}" ] || gagal "Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 kosong"
          printf '%s' "${PLAY_SA_BASE64}" | base64 -d \
            | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!s.client_email||!s.private_key) process.exit(1)' 2>/dev/null \
            || gagal "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 bukan service account yang sah"

          # google-services.json di-.gitignore. Dulu EAS menyuntikkannya lewat
          # variabel berkas GOOGLE_SERVICES_JSON; tanpa itu `expo prebuild`
          # gagal menyalinnya (run #13 berhenti persis di sana).
          [ -n "${GOOGLE_SERVICES_BASE64}" ] || gagal "Secret GOOGLE_SERVICES_JSON_BASE64 kosong"
          printf '%s' "${GOOGLE_SERVICES_BASE64}" | base64 -d | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8"))' 2>/dev/null \
            || gagal "GOOGLE_SERVICES_JSON_BASE64 bukan base64 dari JSON yang sah"

          [ -n "${KEYSTORE_BASE64}" ] || gagal "Secret RADPRO_RELEASE_KEYSTORE_BASE64 kosong"
          [ -n "${RADPRO_RELEASE_STORE_PASSWORD}" ] || gagal "Secret RADPRO_RELEASE_STORE_PASSWORD kosong"
          [ -n "${RADPRO_RELEASE_KEY_ALIAS}" ] || gagal "Secret RADPRO_RELEASE_KEY_ALIAS kosong"
          [ -n "${RADPRO_RELEASE_KEY_PASSWORD}" ] || gagal "Secret RADPRO_RELEASE_KEY_PASSWORD kosong"

          # Base64 yang rusak baru ketahuan saat decode; lebih murah sekarang.
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > /tmp/uji-keystore 2>/dev/null \
            || gagal "RADPRO_RELEASE_KEYSTORE_BASE64 bukan base64 yang sah"
          [ -s /tmp/uji-keystore ] || gagal "Keystore hasil decode kosong"
          rm -f /tmp/uji-keystore

          echo "Kredensial signing lengkap."

      # Token checkout tidak disimpan di .git/config. Job ini memang punya
      # `contents: write`, tetapi yang membutuhkannya hanya langkah pencatatan
      # di akhir; `npm ci` dan Gradle menjalankan kode pihak ketiga yang tidak
      # boleh bisa membaca token itu. Langkah pencatatan memasang token sendiri
      # dan mencabutnya lagi.
      - name: Ambil kode
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pasang Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # JDK sama dengan image `android-ci` lama (eclipse-temurin:17). AGP 8.x
      # menuntut JDK 17, dan JDK 21 belum didukung penuh toolchain React
      # Native 0.81.
      - name: Pasang JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Pasang dependensi
        run: npm ci --no-audit

      # Gerbang mutu dijalankan sebelum build panjangnya, bukan sesudah: satu
      # kesalahan tipe tidak pantas menghabiskan satu jam waktu runner.
      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tes unit
        run: npx jest --ci

      # Play sendiri yang menegakkan aturan "lebih besar dari setiap bundle yang
      # pernah diunggah", jadi angkanya dihitung dari daftar bundle di sana.
      # Nomor run CI tidak dipakai: ia tidak tahu apa yang sudah pernah
      # diunggah (termasuk build EAS dan Gitea sebelumnya), dan berulang dari
      # nol bila workflow dipindah atau diganti nama.
      - name: Tentukan versionCode
        env:
          OVERRIDE: ${{ inputs.version_code_override }}
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          # Dipisah dari `export` supaya base64 yang rusak menggagalkan langkah.
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON="$(printf '%s' "${PLAY_SA_BASE64}" | base64 -d)"
          export GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          VERSION_CODE="$(node scripts/play-internal.js next-version-code "${OVERRIDE:-}")"
          echo "versionCode: ${VERSION_CODE}"
          echo "RADPRO_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      # Runner GitHub-hosted sudah membawa Android SDK, tetapi NDK dan CMake yang
      # tersedia di sana ikut bergeser tiap pembaruan image. Versi yang dipakai
      # build dipasang eksplisit, lalu dibuktikan lewat source.properties —
      # berkas yang dibaca Gradle untuk mengenali paket.
      - name: Pasang komponen Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "${SDKMANAGER}" ] || { echo "::error::sdkmanager tidak ada di ${SDKMANAGER}" >&2; exit 1; }

          "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --install \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}" > /dev/null

          periksa() {
            berkas="${ANDROID_HOME}/$1/source.properties"
            grep -qE "$2" "${berkas}" 2>/dev/null \
              || { echo "::error::$1 tidak dikenali: ${berkas} tidak memuat $2" >&2; exit 1; }
            echo "  ok $1"
          }
          periksa "platforms/android-${ANDROID_PLATFORM}" "AndroidVersion.ApiLevel *= *${ANDROID_PLATFORM}"
          periksa "build-tools/${ANDROID_BUILD_TOOLS}" "Pkg.Revision *= *${ANDROID_BUILD_TOOLS}"
          periksa "ndk/${ANDROID_NDK_VERSION}" "Pkg.Revision *= *${ANDROID_NDK_VERSION}"
          periksa "cmake/${ANDROID_CMAKE_VERSION}" "Pkg.Revision *= *${ANDROID_CMAKE_VERSION}"

          # Image runner menunjuk NDK bawaannya lewat variabel ini; arahkan ke
          # versi yang dipatok supaya alat apa pun yang membacanya sepakat.
          {
            echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"

      # Tanpa cache yang bertahan antar-run, setiap build mengunduh ulang seluruh
      # dependensi Maven. actions/cache dipakai langsung, bukan
      # gradle/actions/setup-gradle: sejak v6 caching di sana adalah komponen
      # proprietary dengan syarat lisensi tersendiri.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Kompilasi C++ New Architecture ditambah R8 bisa melewati 7 GB. Swap
      # membuat build melambat alih-alih dibunuh OOM ("exit 137" tanpa pesan).
      # Image GitHub biasanya sudah membawa swap; kalau tidak, dibuat di sini.
      # Ruang disk ikut dilapangkan: NDK, cache Gradle, dan keluaran build empat
      # ABI butuh belasan GB.
      - name: Siapkan swap dan ruang disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          SWAP_AKTIF="$(swapon --show --noheadings)"
          if [ -z "${SWAP_AKTIF}" ]; then
            sudo fallocate -l 4G /mnt/swap-build
            sudo chmod 600 /mnt/swap-build
            sudo mkswap /mnt/swap-build > /dev/null
            sudo swapon /mnt/swap-build
          fi
          swapon --show
          free -h
          df -h /

      - name: Pasang google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${GOOGLE_SERVICES_BASE64}" | base64 -d > google-services.json
          echo "google-services.json terpasang ($(stat -c %s google-services.json) byte)."

      - name: Generate proyek Android
        env:
          EXPO_PUBLIC_APP_VARIANT: production
          EXPO_DEBUG: "false"
          EXPO_NO_DOTENV: "1"
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          chmod +x android/gradlew

          # Memori Gradle disetel di sini, bukan di app.json. Run #16 gagal di
          # menit ke-107 karena R8 kehabisan heap 2 GiB: app.json meminta 4 GB
          # lewat expo-build-properties.gradleProperties, tetapi plugin itu
          # tidak mengenal opsi tersebut dan mengabaikannya diam-diam. EAS tidak
          # pernah terkena karena mesin build-nya menyetel memori sendiri.
          #
          # Anggaran mesin 16 GB (runner GitHub-hosted repo publik, 4 vCPU).
          # Heap 5 GB + metaspace 1 GB sama dengan runner android-ci lama; R8
          # sudah terbukti OOM di 2 GiB. Sisanya (~9 GB, ditambah swap) untuk
          # OS, Metro, dan kompilasi C++ empat worker. Kotlin dikompilasi di dalam
          # proses Gradle supaya tidak ada JVM kedua yang meminta heap sendiri
          # di luar anggaran itu.
          sed -i '/^org\.gradle\.jvmargs=/d; /^kotlin\.daemon\.jvmargs=/d; /^kotlin\.compiler\.execution\.strategy=/d' android/gradle.properties
          # Diawali baris baru: gradle.properties hasil prebuild tidak diakhiri
          # newline, dan tanpa ini pengaturan heap menempel ke baris terakhir
          # (android.extraMavenRepos) — heap tidak terbaca dan repositori
          # JitPack ikut rusak.
          printf '\n%s\n%s\n' \
            'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' \
            'kotlin.compiler.execution.strategy=in-process' \
            >> android/gradle.properties

          # Dibuktikan, bukan diasumsikan: tepat satu baris jvmargs yang benar,
          # dan baris extraMavenRepos masih utuh.
          [ "$(grep -c '^org\.gradle\.jvmargs=-Xmx5g ' android/gradle.properties)" = 1 ] || {
            echo "::error::org.gradle.jvmargs tidak tertulis sebagai satu baris utuh di gradle.properties" >&2
            cat android/gradle.properties >&2
            exit 1
          }
          grep -qE '^android\.extraMavenRepos=\[.*\]$' android/gradle.properties || {
            echo "::error::Baris android.extraMavenRepos rusak setelah gradle.properties diubah" >&2
            exit 1
          }
          grep -E '^(org\.gradle\.jvmargs|kotlin\.compiler|android\.extraMavenRepos)' android/gradle.properties

      # Keystore ditulis setelah prebuild: `--clean` menghapus seluruh isi
      # android/, termasuk berkas apa pun yang ditaruh di sana sebelumnya.
      - name: Pasang keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RADPRO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "android/app/${KEYSTORE_NAMA}"
          chmod 600 "android/app/${KEYSTORE_NAMA}"
          echo "Keystore terpasang ($(stat -c %s "android/app/${KEYSTORE_NAMA}") byte)."

      - name: Verifikasi kunci dan versionCode sebelum build
        env:
          RADPRO_RELEASE_STORE_PASSWORD: ${{ secrets.RADPRO_RELEASE_STORE_PASSWORD }}
          RADPRO_RELEASE_KEY_ALIAS: ${{ secrets.RADPRO_RELEASE_KEY_ALIAS }}
          SIDIK_DIHARAPKAN: ${{ vars.RADPRO_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail

          # Sidik jari kunci. Play Store hanya menerima unggahan yang
          # ditandatangani kunci upload yang terdaftar; kunci yang salah
          # ditolak setelah build selesai dan terunggah.
          SIDIK="$(keytool -list -v \
            -keystore "android/app/${KEYSTORE_NAMA}" \
            -alias "${RADPRO_RELEASE_KEY_ALIAS}" \
            -storepass "${RADPRO_RELEASE_STORE_PASSWORD}" 2>/dev/null \
            | awk 'tolower($0) ~ /sha256:/ && !ketemu { sub(/.*SHA256: */, ""); gsub(/ /, ""); print; ketemu=1 }')"

          [ -n "${SIDIK}" ] || {
            echo "::error::Tidak bisa membaca sidik jari kunci — alias atau password keystore salah." >&2
            exit 1
          }
          echo "Sidik jari kunci (SHA-256): ${SIDIK}"

          if [ -z "${SIDIK_DIHARAPKAN:-}" ]; then
            echo "::warning::Variabel RADPRO_UPLOAD_CERT_SHA256 belum diset. Bandingkan sidik jari di atas dengan sertifikat kunci upload di Play Console, lalu simpan sebagai variabel environment production (scripts/siapkan-secret-github.sh) supaya pergantian kunci tertangkap otomatis."
          elif [ "${SIDIK}" != "${SIDIK_DIHARAPKAN}" ]; then
            echo "::error::Sidik jari kunci tidak cocok dengan RADPRO_UPLOAD_CERT_SHA256. Play Store akan menolak artefak ini." >&2
            exit 1
          else
            echo "Sidik jari kunci cocok dengan yang terdaftar."
          fi

          # versionCode yang benar-benar tertulis ke proyek hasil prebuild.
          # Memeriksa niat (env) tidak cukup — yang menentukan isi artefak
          # adalah angka di build.gradle.
          TERTULIS="$(awk 'match($0, /versionCode +[0-9]+/) && !ketemu { s=substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", s); print s; ketemu=1 }' android/app/build.gradle)"
          echo "versionCode di build.gradle: ${TERTULIS} (diharapkan ${RADPRO_VERSION_CODE})"

          [ "${TERTULIS}" = "${RADPRO_VERSION_CODE}" ] || {
            echo "::error::versionCode di build.gradle (${TERTULIS}) tidak sama dengan yang diminta (${RADPRO_VERSION_CODE}). app.config.ts tidak menerima RADPRO_VERSION_CODE." >&2
            exit 1
          }

      - name: Build AAB
        env:
          EXPO_PUBLIC_APP_VARIANT: production
          EXPO_DEBUG: "false"
          EXPO_NO_DOTENV: "1"
          RADPRO_RELEASE_STORE_FILE: ${{ env.KEYSTORE_NAMA }}
          RADPRO_RELEASE_STORE_PASSWORD: ${{ secrets.RADPRO_RELEASE_STORE_PASSWORD }}
          RADPRO_RELEASE_KEY_ALIAS: ${{ secrets.RADPRO_RELEASE_KEY_ALIAS }}
          RADPRO_RELEASE_KEY_PASSWORD: ${{ secrets.RADPRO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          # --no-daemon: satu build per job, daemon yang menetap tidak memberi
          # apa-apa selain proses JVM tambahan di akhir job.
          #
          # --max-workers=4: sama dengan jumlah vCPU, dan tiap worker menjalankan
          # kompilasi C++ New Architecture sendiri-sendiri. Lebih banyak worker
          # di atas heap Gradle 5 GB berisiko menembus 16 GB dan dibunuh OOM —
          # gagal yang tampil sebagai "exit 137" tanpa satu pun pesan kompilasi.
          ./gradlew :app:bundleRelease -x lint -x lintVitalRelease --no-daemon --max-workers=4

      # Langkah inilah yang menutup jebakan debug-signing. Build di atas tetap
      # "berhasil" tanpa kredensial yang benar; yang membedakan hanya siapa
      # penandatangannya.
      - name: Verifikasi tanda tangan artefak
        run: |
          set -euo pipefail

          [ -f "${AAB_PATH}" ] || {
            echo "::error::AAB tidak ditemukan di ${AAB_PATH}" >&2
            exit 1
          }

          SERTIFIKAT="$(jarsigner -verify -verbose:summary -certs "${AAB_PATH}" 2>&1)"
          awk 'tolower($0) ~ /jar verified|signed by/' <<< "${SERTIFIKAT}"

          # Pencocokan teks memakai here-string, bukan pipa. Keluaran jarsigner
          # untuk AAB sangat panjang: di bawah pipefail, `grep -q` yang berhenti
          # di kecocokan pertama membuat printf kena SIGPIPE dan seluruh pipa
          # dianggap gagal. Run #17 menolak AAB yang bertanda tangan benar
          # karena itu — dan di dalam `if`, cacat yang sama bisa meloloskan
          # artefak bertanda tangan debug.
          grep -q 'jar verified' <<< "${SERTIFIKAT}" || {
            echo "::error::AAB tidak lolos verifikasi tanda tangan." >&2
            exit 1
          }

          # Debug keystore Android selalu memakai alias androiddebugkey dengan
          # subjek CN=Android Debug. Kalau salah satunya muncul, Gradle jatuh ke
          # cabang debug dan artefak ini tidak layak diunggah.
          if grep -qiE 'androiddebugkey|CN=Android Debug' <<< "${SERTIFIKAT}"; then
            echo "::error::AAB ditandatangani debug keystore, bukan kunci rilis. Play Store akan menolaknya." >&2
            exit 1
          fi

          echo "Artefak ditandatangani kunci rilis."
          echo "Ukuran: $(stat -c %s "${AAB_PATH}") byte"
          echo "SHA-256 artefak: $(sha256sum "${AAB_PATH}" | cut -d' ' -f1)"

      # Isi bundle JS diperiksa dari artefak, bukan dari env: yang dijalankan
      # perangkat adalah bundle di dalam AAB. Firebase JS SDK butuh konfigurasi
      # web — key Android ditolak Google untuk panggilan JS (403), dan bundle
      # yang membawanya tetap lolos build lalu mematikan chat serta realtime
      # work order. OTA 8f311761 terbit dengan cacat persis itu.
      - name: Periksa konfigurasi Firebase di bundle
        run: |
          set -euo pipefail
          unzip -p "${AAB_PATH}" base/assets/index.android.bundle > /tmp/bundle-aab

          grep -qaE '1:[0-9]+:web:[0-9a-f]+' /tmp/bundle-aab || {
            echo "::error::Bundle di AAB tidak memuat app id Firebase web. Chat dan realtime akan ditolak Google (403)." >&2
            exit 1
          }
          if grep -qaE '1:[0-9]+:android:[0-9a-f]+' /tmp/bundle-aab; then
            echo "::error::Bundle di AAB memuat app id Firebase Android — ditolak untuk panggilan dari JS SDK." >&2
            exit 1
          fi
          rm -f /tmp/bundle-aab
          echo "Konfigurasi Firebase di bundle: web."

      # runtimeVersion dibaca dari artefak — base/assets/fingerprint, ditulis
      # expo-updates saat build Gradle. Fingerprint yang dihitung ulang secara
      # lokal bisa berbeda dari angka itu, dan perangkat hanya menerima OTA yang
      # runtime-nya sama persis dengan yang tertanam.
      - name: Baca runtimeVersion dari AAB
        run: |
          set -euo pipefail
          RUNTIME="$(unzip -p "${AAB_PATH}" base/assets/fingerprint | tr -d '[:space:]')"
          [ "${#RUNTIME}" -ge 16 ] || {
            echo "::error::base/assets/fingerprint di AAB kosong atau tidak sah: '${RUNTIME}'" >&2
            exit 1
          }
          echo "RADPRO_FINGERPRINT=${RUNTIME}" >> "$GITHUB_ENV"
          echo "runtimeVersion tertanam di AAB: ${RUNTIME}"

      # runtimeVersion adalah fingerprint yang dihitung di mesin build. Mesin
      # berbeda bisa menghasilkan fingerprint berbeda untuk kode native yang
      # sama; bila itu tercatat, OTA berikutnya menyasar runtime baru dan HP
      # yang masih memakai APK lama berhenti menerima update. Perbedaan ini
      # selalu ditampilkan agar bisa diputuskan sebelum APK disebar.
      - name: Bandingkan runtimeVersion dengan build terakhir
        run: |
          set -euo pipefail
          TERCATAT="$(node -p 'require("./native-build.json").runtimeVersion')"
          echo "runtimeVersion build ini   : ${RADPRO_FINGERPRINT}"
          echo "runtimeVersion tercatat    : ${TERCATAT}"
          if [ "${RADPRO_FINGERPRINT}" = "${TERCATAT}" ]; then
            echo "SAMA — OTA tetap menyasar HP pengguna yang ada."
          else
            echo "::warning::runtimeVersion BERBEDA dari build terakhir (${TERCATAT}). Bila build ini dicatat, OTA berikutnya hanya diterima HP yang sudah memasang APK baru."
          fi

      # Track internal saja. Promosi ke produksi sengaja manual lewat Play
      # Console, setelah build diuji di perangkat.
      - name: Unggah ke Play Store (track internal)
        # Dilewati pada mode uji: tidak boleh ada efek samping.
        if: ${{ !inputs.mode_uji }}
        env:
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          # Dipisah dari `export` supaya base64 yang rusak menggagalkan langkah.
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON="$(printf '%s' "${PLAY_SA_BASE64}" | base64 -d)"
          export GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          VERSION_NAME="$(node -p 'require("./app.json").expo.version')"
          node scripts/play-internal.js upload "${AAB_PATH}" "${RADPRO_VERSION_CODE}" "${VERSION_NAME} (${RADPRO_VERSION_CODE})"
          echo "::notice::versionCode ${RADPRO_VERSION_CODE} terbit di track internal. Uji di perangkat, lalu promosikan ke produksi lewat Play Console."

      # Catatan ini yang dibaca workflow OTA: runtime tujuan, dan kapan harus
      # menahan diri karena bagian native berubah. Ditulis hanya setelah
      # unggahan berhasil — catatan yang mendahuluinya akan mengarahkan OTA ke
      # APK yang tidak pernah terbit.
      #
      # Hash native dihitung di commit yang dibangun, lalu berkasnya diletakkan
      # di atas main terbaru: main bisa sudah maju selama build berjalan.
      #
      # Commit ini tidak memakai [skip ci], sama seperti di Gitea. Push dengan
      # GITHUB_TOKEN memang tidak memicu run baru (jadi tidak ada loop), dan
      # karena itu OTA untuk JS HEAD disusulkan oleh langkah berikutnya.
      #
      # Token dipasang hanya selama langkah ini dan dicabut lewat trap, apa pun
      # hasilnya. Ia dioper lewat env, bukan disisipkan ke skrip, supaya tidak
      # ikut menjadi teks perintah.
      - name: Catat build native ke main
        # Dilewati pada mode uji: tidak boleh ada efek samping.
        if: ${{ !inputs.mode_uji }}
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/native-state.js record "${RADPRO_FINGERPRINT}" "${RADPRO_VERSION_CODE}"
          cp native-build.json /tmp/native-build.json

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          AUTH_BASIC="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH_BASIC}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH_BASIC}"

          for percobaan in 1 2 3; do
            git fetch -q --depth=1 origin main
            git checkout -q -B catat-build FETCH_HEAD
            cp /tmp/native-build.json native-build.json
            git add native-build.json
            git commit -q -m "chore(build): catat build native versionCode ${RADPRO_VERSION_CODE}" \
              -m "runtimeVersion ${RADPRO_FINGERPRINT}, dibangun dari ${GITHUB_SHA}."
            if git push -q origin HEAD:refs/heads/main; then
              echo "native-build.json tercatat di main."
              break
            fi
            if [ "$percobaan" = 3 ]; then
              echo "::error::Gagal mencatat native-build.json ke main. AAB sudah di track internal, tetapi OTA belum tahu runtime barunya." >&2
              exit 1
            fi
            echo "main bergerak, mengulang pencatatan (percobaan $percobaan)" >&2
            sleep 5
          done

      # Push dengan GITHUB_TOKEN tidak memicu workflow lain, jadi commit
      # pencatatan di atas tidak akan menjalankan ota.yml. JS yang masuk ke main
      # selama build berjalan tidak ada di AAB ini; tanpa susulan, ia baru
      # terkirim di push berikutnya.
      #
      # Susulan hanya berjalan bila main memang bergerak, dan tetap melewati
      # penahan native yang sama dengan ota.yml: bila berkas native ikut berubah,
      # build berikutnya sudah terpicu dan OTA ditahan sampai ia tercatat.
      #
      # AAB sengaja tidak diunggah sebagai artefak Actions: salinannya sudah ada
      # di Play Console (App bundle explorer), dan artefak bertanda tangan rilis
      # tidak perlu tersebar ke setiap pemegang akses baca repo.
      - name: Susulkan OTA ke runtime baru
        # Dilewati pada mode uji: tidak boleh ada efek samping.
        if: ${{ !inputs.mode_uji }}
        env:
          APP_UPDATE_PUBLISH_TOKEN: ${{ secrets.APP_UPDATE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          # Salinan kerja kini di atas main terbaru (berisi commit pencatatan).
          if git diff --quiet "${GITHUB_SHA}" HEAD -- . ':(exclude)native-build.json'; then
            echo "main tidak bergerak selama build — JS di AAB sudah yang terbaru, susulan tidak perlu."
            exit 0
          fi

          echo "main bergerak selama build:"
          git diff --name-only "${GITHUB_SHA}" HEAD -- . ':(exclude)native-build.json'

          set +e
          target="$(node scripts/native-state.js ota-target)"
          status_target=$?
          set -e
          if [ "$status_target" = 3 ]; then
            echo "::notice::Berkas native ikut berubah; OTA susulan ditahan sampai build berikutnya tercatat."
            exit 0
          fi
          [ "$status_target" = 0 ] && [ -n "${target}" ] \
            || { echo "::error::native-state.js ota-target gagal (exit ${status_target})"; exit 1; }

          [ -n "${APP_UPDATE_PUBLISH_TOKEN:-}" ] || { echo "::error::Secret APP_UPDATE_PUBLISH_TOKEN belum diset"; exit 1; }
          npm ci --no-audit --prefer-offline
          RUNTIME_VERSION_OVERRIDE="${target}" ./scripts/publish-update.sh production \
            "$(git rev-parse --short HEAD) - susulan setelah build versionCode ${RADPRO_VERSION_CODE}"

      # Runner GitHub-hosted memang dibuang setelah job, tetapi keystore tetap
      # dihapus sedini mungkin: tidak ada alasan ia hidup lebih lama dari
      # build-nya, dan jaminan ini tetap berlaku bila job dipindah ke runner
      # self-hosted.
      - name: Hapus keystore
        if: always()
        run: rm -f "android/app/${KEYSTORE_NAMA}" /tmp/uji-keystore /tmp/bundle-aab google-services.json
