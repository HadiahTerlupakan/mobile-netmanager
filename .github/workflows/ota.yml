name: Publish OTA

# Satu-satunya pemicu OTA biasa. Tidak boleh ada sistem CI lain (Gitea,
# Jenkins) yang ikut menerbitkan OTA dari commit yang sama: satu commit akan
# terbit dua kali ke pengguna yang sama. Selain workflow ini, hanya langkah
# "Susulkan OTA" di build-android.yml yang boleh memanggil skrip publish.
#
# OTA hanya mengirim bundle JavaScript. Perangkat menerima update hanya bila
# `runtimeVersion`-nya sama persis dengan binary terpasang, dan di proyek ini
# runtimeVersion dihitung dari fingerprint native. Karena itu publish yang
# fingerprint-nya bergeser tidak "gagal" — ia berhasil lalu tidak sampai ke
# siapa pun. Job ini menolaknya lebih dulu supaya kegagalannya terlihat.
#
# Workflow ini memakai secret, jadi tidak pernah dipicu `pull_request` atau
# `pull_request_target`.

# Dipicu setelah "Mobile CI" selesai, bukan langsung oleh push. Lint, typecheck,
# dan tes unit karena itu berjalan SEKALI, dan publish hanya terjadi di atas
# commit yang CI-nya hijau — sebelumnya keduanya berjalan paralel dan OTA
# menjalankan ulang seluruh tes hanya untuk menjaga dirinya sendiri.
#
# BAHAYA `workflow_run` yang ditutup di `if` job: event ini juga menyala ketika
# CI selesai untuk pull request, TERMASUK PR dari fork, dan workflow yang
# dipicunya berjalan di konteks repo asal — lengkap dengan secret produksi.
# Itu jalur peningkatan hak akses yang setara `pull_request_target`. Karena itu
# job hanya berjalan bila CI-nya dipicu `push` DI BRANCH main DAN hijau.
on:
  workflow_run:
    workflows: ["Mobile CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      allow_runtime_mismatch:
        description: >-
          Publish walau fingerprint berbeda dari build terakhir. Centang HANYA
          setelah APK dengan fingerprint baru benar-benar tersebar — kalau
          tidak, update ini tidak akan diterima perangkat mana pun.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-ota
  cancel-in-progress: false

jobs:
  publish:
    name: Fingerprint guard & publish
    # Tiga syarat, semuanya wajib: dipicu push (bukan pull request), di branch
    # main, dan CI-nya hijau. Melonggarkan salah satunya membuka publish dari
    # pull request fork dengan secret produksi.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    # Secret publish tinggal di environment `production`, yang hanya boleh
    # dipakai dari branch main.
    environment: production
    steps:
      # Token checkout tidak disimpan di .git/config: job ini tidak menulis ke
      # repo, dan `npm ci` menjalankan skrip pihak ketiga.
      # `workflow_run` menjalankan workflow dari branch default dan TIDAK
      # membawa commit pemicunya. Tanpa `ref` eksplisit, yang terbit adalah
      # HEAD main saat runner jalan — bukan commit yang barusan lulus CI.
      - name: Ambil kode
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Dua commit: penjaga di bawah membandingkan HEAD dengan induknya.
          fetch-depth: 2
          persist-credentials: false

      # Pengganti `paths-ignore` yang hilang bersama pemicu `push`. Commit yang
      # hanya menyentuh dokumentasi atau pipeline tidak mengubah bundle JS;
      # menerbitkannya berarti mengirim ulang bundel identik ke setiap HP.
      - name: Periksa perubahan layak terbit
        id: layak
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "terbit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          berubah=$(git diff --name-only HEAD^ HEAD || true)
          if [ -z "${berubah}" ]; then
            echo "terbit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sisa=$(printf '%s\n' "${berubah}" | grep -vE '^(docs/|\.github/)' | grep -vE '\.md$' || true)
          if [ -z "${sisa}" ]; then
            echo "::notice::Hanya dokumentasi/pipeline yang berubah — publish dilewati."
            echo "terbit=false" >> "$GITHUB_OUTPUT"
          else
            echo "terbit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pasang Node
        if: steps.layak.outputs.terbit == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Pasang dependensi
        if: steps.layak.outputs.terbit == 'true'
        run: npm ci --no-audit

      # Gate mutu lint/typecheck/tes TIDAK diulang di sini: job ini hanya
      # berjalan setelah "Mobile CI" hijau pada commit yang sama (lihat `if`
      # dan `ref` di atas). OTA mengirim JS langsung ke pengguna tanpa review
      # toko, jadi jaring pengamannya tetap wajib — hanya saja dipasang sekali.

      # Publish lewat `scripts/publish-update.sh`. OTA proyek ini TIDAK memakai
      # EAS Update: `app.config.ts` mengarahkan `updates.url` ke
      # `/api/mobile/app-update/manifest` milik netmanager, jadi bundle diekspor
      # lalu diunggah ke server sendiri.
      #
      # Skrip itu juga sudah menyelesaikan soal runtimeVersion: ia mengambil
      # fingerprint dari EAS build, bukan menghitungnya lokal — hash lokal bisa
      # berbeda karena file secret, google-services.json, dan env tidak sama.
      # Itulah sebabnya ia butuh EXPO_TOKEN selain token publish.
      - name: Publish OTA ke server netmanager
        if: steps.layak.outputs.terbit == 'true'
        env:
          APP_UPDATE_PUBLISH_TOKEN: ${{ secrets.APP_UPDATE_PUBLISH_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${APP_UPDATE_PUBLISH_TOKEN:-}" ]; then
            echo "::error::Secret APP_UPDATE_PUBLISH_TOKEN belum diset di environment production."
            exit 1
          fi

          # Pesan commit ditampung di variabel lebih dulu, bukan disubstitusikan
          # langsung di baris perintah — isinya datang dari luar dan tidak boleh
          # sampai ikut dievaluasi shell.
          subject="$(git log -1 --pretty=%s)"

          # Runtime tujuan dan izin terbit ditentukan catatan build native
          # terakhir (native-build.json), bukan fingerprint yang dihitung ulang.
          # JS yang memanggil modul native yang belum ada di APK membuat aplikasi
          # crash, jadi OTA ditahan ketika berkas native HEAD berbeda dari build
          # terakhir — build Android sendiri sudah terpicu otomatis oleh
          # perubahan itu.
          set +e
          target="$(node scripts/native-state.js ota-target)"
          status_target=$?
          set -e
          if [ "$status_target" = 3 ]; then
            echo "::notice::OTA ditahan: bagian native berubah sejak build terakhir. Menunggu build Android selesai dan tercatat."
            exit 0
          fi
          [ "$status_target" = 0 ] || { echo "::error::native-state.js ota-target gagal (exit ${status_target})"; exit 1; }

          if [ -n "${target}" ]; then
            export RUNTIME_VERSION_OVERRIDE="${target}"
            echo "Runtime tujuan dari native-build.json: ${target}"
          else
            echo "native-build.json belum ada — runtime tujuan diambil dari EAS build:list."
          fi

          chmod +x ./scripts/publish-update.sh
          ./scripts/publish-update.sh production "${GITHUB_SHA:0:8} - ${subject}"

      # Jalan keluar ketika unggahan ke server gagal karena jaringan, bukan kode.
      # Transit antara runner GitHub dan server pernah merosot ke ~17 KB/detik
      # (7 Okt 2026), sehingga bundel 13 MB tidak selesai sebelum batas baca
      # Traefik 60 detik. Bundel hasil export disimpan sebagai artifact supaya
      # bisa dipublikasikan dari jalur lain tanpa membangun ulang — membangun
      # ulang di tempat lain berbahaya karena nilai EXPO_PUBLIC_* ditanam ke
      # bundel saat export, dan beda nilai berarti beda konfigurasi Firebase.
      - name: Simpan bundel untuk publikasi manual
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ota-dist-${{ github.sha }}
          path: |
            dist/
            native-build.json
          retention-days: 5
          if-no-files-found: warn

      # OTA hanya sampai ke HP yang memasang build target (native-build.json).
      # Bila build itu belum dirilis di production Play Store, pengguna Play
      # tidak menerima OTA ini tanpa error apa pun (kejadian 15–25 Sep 2026).
      # Langkah ini hanya memperingatkan; tidak pernah menggagalkan publish.
      - name: Periksa build target OTA sudah di production
        if: always()
        continue-on-error: true
        env:
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          [ -f native-build.json ] || { echo "native-build.json tidak ada — dilewati"; exit 0; }
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON="$(printf '%s' "${PLAY_SA_BASE64}" | base64 -d)"
          export GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          # Langkah ini hanya memberi tahu, jadi kegagalannya TIDAK boleh muncul
          # sebagai anotasi merah pada run yang sukses. Play API sempat membalas
          # 503 (8 Okt 2026) dan run yang OTA-nya terbit normal tetap terbaca
          # "1 error" — menyita perhatian ke tempat yang salah setiap kali.
          if ! keluaran=$(node scripts/play-internal.js status-production \
              "$(node -p 'require("./native-build.json").versionCode')" 2>&1); then
            echo "${keluaran}"
            echo "::warning::Status Play Store tidak terbaca; publish OTA tidak terpengaruh."
            exit 0
          fi
          echo "${keluaran}"
