name: Publish OTA

# Satu-satunya pemicu OTA biasa. Tidak boleh ada sistem CI lain (Gitea,
# Jenkins) yang ikut menerbitkan OTA dari commit yang sama: satu commit akan
# terbit dua kali ke pengguna yang sama. Selain workflow ini, hanya langkah
# "Susulkan OTA" di build-android.yml yang boleh memanggil skrip publish.
#
# OTA hanya mengirim bundle JavaScript. Perangkat menerima update hanya bila
# `runtimeVersion`-nya sama persis dengan binary terpasang, dan di proyek ini
# runtimeVersion dihitung dari fingerprint native. Karena itu publish yang
# fingerprint-nya bergeser tidak "gagal" — ia berhasil lalu tidak sampai ke
# siapa pun. Job ini menolaknya lebih dulu supaya kegagalannya terlihat.
#
# Workflow ini memakai secret, jadi tidak pernah dipicu `pull_request` atau
# `pull_request_target`.

on:
  push:
    branches: [main]
    # Perubahan yang tidak ikut ke bundle JS tidak perlu memicu publish.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:
    inputs:
      allow_runtime_mismatch:
        description: >-
          Publish walau fingerprint berbeda dari build terakhir. Centang HANYA
          setelah APK dengan fingerprint baru benar-benar tersebar — kalau
          tidak, update ini tidak akan diterima perangkat mana pun.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-ota
  cancel-in-progress: false

jobs:
  publish:
    name: Fingerprint guard & publish
    runs-on: ubuntu-24.04
    # Secret publish tinggal di environment `production`, yang hanya boleh
    # dipakai dari branch main.
    environment: production
    steps:
      # Token checkout tidak disimpan di .git/config: job ini tidak menulis ke
      # repo, dan `npm ci` menjalankan skrip pihak ketiga.
      - name: Ambil kode
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pasang Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Pasang dependensi
        run: npm ci --no-audit

      # Gate mutu: OTA mengirim JS langsung ke pengguna tanpa melewati review
      # toko, jadi tidak ada jaring pengaman lain di belakangnya.
      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tes unit
        run: npx jest --ci

      # Publish lewat `scripts/publish-update.sh`. OTA proyek ini TIDAK memakai
      # EAS Update: `app.config.ts` mengarahkan `updates.url` ke
      # `/api/mobile/app-update/manifest` milik netmanager, jadi bundle diekspor
      # lalu diunggah ke server sendiri.
      #
      # Skrip itu juga sudah menyelesaikan soal runtimeVersion: ia mengambil
      # fingerprint dari EAS build, bukan menghitungnya lokal — hash lokal bisa
      # berbeda karena file secret, google-services.json, dan env tidak sama.
      # Itulah sebabnya ia butuh EXPO_TOKEN selain token publish.
      - name: Publish OTA ke server netmanager
        env:
          APP_UPDATE_PUBLISH_TOKEN: ${{ secrets.APP_UPDATE_PUBLISH_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${APP_UPDATE_PUBLISH_TOKEN:-}" ]; then
            echo "::error::Secret APP_UPDATE_PUBLISH_TOKEN belum diset di environment production."
            exit 1
          fi

          # Pesan commit ditampung di variabel lebih dulu, bukan disubstitusikan
          # langsung di baris perintah — isinya datang dari luar dan tidak boleh
          # sampai ikut dievaluasi shell.
          subject="$(git log -1 --pretty=%s)"

          # Runtime tujuan dan izin terbit ditentukan catatan build native
          # terakhir (native-build.json), bukan fingerprint yang dihitung ulang.
          # JS yang memanggil modul native yang belum ada di APK membuat aplikasi
          # crash, jadi OTA ditahan ketika berkas native HEAD berbeda dari build
          # terakhir — build Android sendiri sudah terpicu otomatis oleh
          # perubahan itu.
          set +e
          target="$(node scripts/native-state.js ota-target)"
          status_target=$?
          set -e
          if [ "$status_target" = 3 ]; then
            echo "::notice::OTA ditahan: bagian native berubah sejak build terakhir. Menunggu build Android selesai dan tercatat."
            exit 0
          fi
          [ "$status_target" = 0 ] || { echo "::error::native-state.js ota-target gagal (exit ${status_target})"; exit 1; }

          if [ -n "${target}" ]; then
            export RUNTIME_VERSION_OVERRIDE="${target}"
            echo "Runtime tujuan dari native-build.json: ${target}"
          else
            echo "native-build.json belum ada — runtime tujuan diambil dari EAS build:list."
          fi

          chmod +x ./scripts/publish-update.sh
          ./scripts/publish-update.sh production "${GITHUB_SHA:0:8} - ${subject}"

      # OTA hanya sampai ke HP yang memasang build target (native-build.json).
      # Bila build itu belum dirilis di production Play Store, pengguna Play
      # tidak menerima OTA ini tanpa error apa pun (kejadian 15–25 Sep 2026).
      # Langkah ini hanya memperingatkan; tidak pernah menggagalkan publish.
      - name: Periksa build target OTA sudah di production
        if: always()
        continue-on-error: true
        env:
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          [ -f native-build.json ] || { echo "native-build.json tidak ada — dilewati"; exit 0; }
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON="$(printf '%s' "${PLAY_SA_BASE64}" | base64 -d)"
          export GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          node scripts/play-internal.js status-production "$(node -p 'require("./native-build.json").versionCode')"
